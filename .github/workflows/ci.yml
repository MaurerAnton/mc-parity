name: verify

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luanti (PPA) + luac
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:minetestdevs/stable
          sudo apt-get update
          sudo apt-get install -y luanti-server luanti lua5.1 git

      - name: Run tools/verify.sh
        run: |
          chmod +x tools/verify.sh
          ./tools/verify.sh
